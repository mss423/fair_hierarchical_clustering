name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check src/fair_hc tests examples scripts
      - run: pytest -q
      - run: fair-hc benchmark --config configs/smoke.json --output /tmp/fair-hc-smoke
      - run: fair-hc benchmark --config configs/smoke.json --output /tmp/fair-hc-smoke --resume
      - run: fair-hc demo --output /tmp/fair-hc-demo.html
      - run: python -m build --no-isolation
